[project]
name = "simapp"
version = "0.1.0"
description = "Async job workflow engine comparison"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "alembic>=1.14.0",
    "procrastinate>=3.9.0",
    "python-multipart>=0.0.12",
    "typer>=0.27.1",
    "httpx>=0.28.1",
    "docker>=7.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "typer>=0.27.1",
    "docker>=7.2.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simapp"]

[tool.ruff]
target-version = "py312"
line-length = 100
